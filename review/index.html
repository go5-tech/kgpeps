<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Review Your Order | Peptide Central</title>
<link rel="canonical" href="https://peptidecentral.in/review/">
<link rel="icon" href="/logo-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0a0f1e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(10,15,30,.08);max-width:460px;width:100%;padding:2.5rem 2rem;text-align:center}
.logo{width:56px;height:56px;margin:0 auto 1.2rem;display:block}
h1{font-size:1.45rem;font-weight:800;margin-bottom:.5rem}
p{color:#5b6478;font-size:.95rem;line-height:1.6;margin-bottom:1.6rem}
.stars{font-size:1.6rem;letter-spacing:.2rem;margin-bottom:1.2rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:14px 20px;border-radius:12px;font-weight:700;font-size:.95rem;text-decoration:none;margin-bottom:.8rem;transition:.15s}
.btn-tp{background:#00b67a;color:#fff}
.btn-tp:hover{background:#009c69}
.btn-g{background:#1d4ed8;color:#fff}
.btn-g:hover{background:#173db0}
.btn-wa{background:#f1f5f9;color:#0a0f1e}
.btn-wa:hover{background:#e2e8f0}
.note{font-size:.75rem;color:#9aa3b5;margin-top:1.2rem;margin-bottom:0}
</style>
</head>
<body>
<div class="card">
  <img src="/logo-icon.png" alt="Peptide Central logo" class="logo">
  <h1>How was your order?</h1>
  <div class="stars">⭐⭐⭐⭐⭐</div>
  <p>Your review takes 60 seconds and helps other researchers in India find verified, COA-backed peptides.</p>
  <a class="btn btn-tp" href="https://www.trustpilot.com/evaluate/peptidecentral.in" target="_blank" rel="noopener">
    ★ Review us on Trustpilot
  </a>
  <a class="btn btn-g" id="google-review" href="https://g.page/r/REPLACE_WITH_GBP_REVIEW_ID/review" target="_blank" rel="noopener" style="display:none">
    Review us on Google
  </a>
  <a class="btn btn-wa" href="https://wa.me/910000000000?text=Hi%2C%20I%20want%20to%20share%20feedback%20about%20my%20order" target="_blank" rel="noopener">
    💬 Private feedback on WhatsApp
  </a>
  <p class="note">Had a problem? Message us on WhatsApp first — we fix issues fast.</p>
</div>
</body>
</html>
